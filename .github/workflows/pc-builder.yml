name: PC Builder — source checks and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s pc-builder/tests -v
      - name: Room response parser
        run: g++ -std=c++20 -O2 -Iruntime/include pc-builder/tests/room_parser_test.cpp -o /tmp/room-parser && /tmp/room-parser
      - name: Matchmaking filter
        run: g++ -std=c++20 -O2 -Iruntime/include pc-builder/tests/match_filter_test.cpp -o /tmp/match-filter && /tmp/match-filter
      - name: Fresh Retro Rewind settings
        run: g++ -std=c++20 -O2 -Iruntime/include runtime/tests/pc_retro_defaults_tests.cpp -o /tmp/retro-defaults && /tmp/retro-defaults
      - name: Retro Rewind update manifest
        run: g++ -std=c++20 -O2 -Iruntime/include runtime/tests/pc_rr_update_manifest_tests.cpp -o /tmp/retro-updates && /tmp/retro-updates
      - name: My Stuff patch selection
        run: g++ -std=c++20 -O2 -Iruntime/include -Iruntime/third_party/pugixml runtime/tests/pc_my_stuff_tests.cpp runtime/third_party/pugixml/pugixml.cpp -o /tmp/my-stuff && /tmp/my-stuff
      - name: Dynamic and legacy language banks
        run: g++ -std=c++20 -O2 -Iruntime/include runtime/tests/pc_locale_bank_tests.cpp -o /tmp/locale-bank && /tmp/locale-bank
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: python pc-builder/build_installer.py
      - name: Self-contained runtime smoke test
        shell: python
        run: |
          import subprocess
          subprocess.run(['pc-builder/dist/MKWii-PC-Builder.exe', '--self-test'], check=True)
          subprocess.run(['pc-builder/dist/MKWii-PC-Builder.exe', '--test-progress-parser'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MKWii-PC-Builder-Windows
          path: |
            pc-builder/dist/MKWii-PC-Builder.exe
            pc-builder/dist/SHA256SUMS.txt
